---
services:
  artitrove:
    build: .
    restart: unless-stopped
    ports:
      # ARTITROVE_PORT is a bare port number, not host:port.
      - "${ARTITROVE_PORT:-8080}:8080"
    environment:
      ARTITROVE_TOKEN: ${ARTITROVE_TOKEN:?set ARTITROVE_TOKEN (at least 16 characters)}
      ARTITROVE_BASE_URL: ${ARTITROVE_BASE_URL:-http://localhost:${ARTITROVE_PORT:-8080}}
      ARTITROVE_INDEX: ${ARTITROVE_INDEX:-}
      ARTITROVE_MAX_SIZE: ${ARTITROVE_MAX_SIZE:-}
    volumes:
      - artitrove-data:/data

volumes:
  artitrove-data:
