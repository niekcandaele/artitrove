---
name: release
"on":
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race ./...
      - name: binaries
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "dist/artitrove-$os-$arch" ./cmd/artitrove
          done
          cd dist && sha256sum artitrove-* > checksums.txt
      - name: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          tags=(-t "$IMAGE:${GITHUB_REF_NAME#v}")
          # A pre-release tag such as v0.1.0-rc1 must not move latest.
          case "$GITHUB_REF_NAME" in *-*) ;; *) tags+=(-t "$IMAGE:latest") ;; esac
          docker buildx build --platform linux/amd64,linux/arm64 --push "${tags[@]}" .
      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag $prerelease
